function sellAt(p, fxRate) {
  var fee = 10;
  var harvest = p.bkt >= 20000 ? 3000 : p.bkt >= 15000 ? 2250 : 1500;

  var raw = p.avg * 1.25;
  var sts = raw > 0 ? (hT + fee) / (p.cur === "GBP" ? raw / 100 : raw) : 0;
  var adj = sts > 0 ? fee / sts : 0;
  return p.cur === "GBP" ? Math.ceil((raw + adj * 100) * 100) / 100 : Math.ceil((raw + adj) * 100) / 100;
