function handlePortfolioUpload(e){

  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var lines=ev.target.result.split("\n");
      var headers=parseCsvLine(lines[0]);
      var symIdx=headers.indexOf("Symbol"),qtyIdx=headers.indexOf("Quantity"),avgIdx=headers.indexOf("Purchase Price"),prIdx=headers.indexOf("Current Price");
      if(symIdx<0||qtyIdx<0)throw new Error("Missing columns");
      var updated=data.slice();
      var count=0;
      for(var i=1;i<lines.length;i++){
        var cols=parseCsvLine(lines[i]);if(cols.length<=symIdx)continue;
        var sym=cols[symIdx].replace(".L","").replace(/"/g,"").trim();
        if(sym==="$$CASH_TX"||!sym)continue;
        var qty=parseFloat(cols[qtyIdx]),avg=avgIdx>=0?parseFloat(cols[avgIdx]):0,pr=prIdx>=0?parseFloat(cols[prIdx]):0;
        if(isNaN(qty))continue;
        var matchKey=sym==="AV"?"AV.":sym;
        updated=updated.map(function(p){
          if(p.t!==matchKey)return p;
          var u=Object.assign({},p,{sh:qty});
          if(!isNaN(avg)&&avg>0)u.avg=avg;
          if(!isNaN(pr)&&pr>0){
            if(p.cur==="GBP")u.cv=Math.round(qty*pr/100);
            else u.cv=Math.round(qty*pr/fx);
          }
          count++;
          return u;
        });
      }
      setData(updated);doSave(updated);
      setUploadMsg(count+" positions updated");setTimeout(function(){setUploadMsg("")},3000);
    }catch(err){setUploadMsg("Error: "+err.message);setTimeout(function(){setUploadMsg("")},3000)}
  };
  reader.readAsText(file);
  e.target.value="";
}

function handleTxnUpload(e){
